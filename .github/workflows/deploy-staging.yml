name: Deploy to Toolforge (Staging)

on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: "Enter deploy passphrase to confirm"
        required: true

permissions:
  contents: read

concurrency:
  group: broomstick-staging-deploy
  cancel-in-progress: true

jobs:
  check-passphrase:
    name: Check deployment authorization
    runs-on: ubuntu-latest

    steps:
      - name: Verify passphrase
        env:
          ENTERED_PASSPHRASE: ${{ github.event.inputs.passphrase }}
          EXPECTED_PASSPHRASE: ${{ secrets.DEPLOY_PASSPHRASE_STAGING }}
        run: |
          if [ "$ENTERED_PASSPHRASE" != "$EXPECTED_PASSPHRASE" ]; then
            echo "Wrong passphrase. Aborting."
            exit 1
          fi

      - name: Verify branch
        env:
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          if [ "$GITHUB_REF_VALUE" != "refs/heads/staging" ]; then
            echo "This workflow must be run from the staging branch."
            exit 1
          fi

  deploy:
    name: Deploy
    needs: check-passphrase
    runs-on: ubuntu-latest

    steps:
      - name: Check out staging
        uses: actions/checkout@v5
        with:
          ref: staging

      - name: Show deployed commit
        run: |
          echo "Deploying commit:"
          git log -1 --oneline
          echo
          echo "Full SHA:"
          git rev-parse HEAD

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm run type-check

      - name: Build application
        run: pnpm run build

      - name: Get build metadata
        id: build
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package build
        run: |
          tar czf \
            "broomstick-${{ steps.build.outputs.version }}-${{ steps.build.outputs.sha }}-staging.tgz" \
            -C dist .

      - name: Upload package to Toolforge
        env:
          TF_SSH_KEY: ${{ secrets.TF_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TF_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan login.toolforge.org >> ~/.ssh/known_hosts

          scp \
            -i ~/.ssh/id_ed25519 \
            "broomstick-${{ steps.build.outputs.version }}-${{ steps.build.outputs.sha }}-staging.tgz" \
            noncesura@login.toolforge.org:~/broomstick-release/

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: login.toolforge.org
          username: noncesura
          key: ${{ secrets.TF_SSH_KEY }}
          port: 22
          request_pty: true
          script_stop: true
          script: |
            become broomstick-staging bash -c '
              set -e

              archive=~noncesura/broomstick-release/broomstick-${{ steps.build.outputs.version }}-${{ steps.build.outputs.sha }}-staging.tgz

              echo "Deploying archive:"
              echo "$archive"

              rm -rf ~/public_html/*
              tar xzf "$archive" -C ~/public_html/

              echo "Deployment complete."
            '
