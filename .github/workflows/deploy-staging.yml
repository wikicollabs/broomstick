name: Deploy to Toolforge (Staging)

on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: "Enter deploy passphrase to confirm"
        required: true

permissions:
  contents: read

concurrency:
  group: broomstick-staging-deploy
  cancel-in-progress: true

jobs:
  check-passphrase:
    name: Check deployment authorization
    runs-on: ubuntu-latest

    steps:
      - name: Verify passphrase
        env:
          ENTERED_PASSPHRASE: ${{ github.event.inputs.passphrase }}
          EXPECTED_PASSPHRASE: ${{ secrets.DEPLOY_PASSPHRASE_STAGING }}
        run: |
          if [ "$ENTERED_PASSPHRASE" != "$EXPECTED_PASSPHRASE" ]; then
            echo "Wrong passphrase. Aborting."
            exit 1
          fi

      - name: Verify branch
        env:
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          if [ "$GITHUB_REF_VALUE" != "refs/heads/staging" ]; then
            echo "This workflow must be run from the staging branch."
            exit 1
          fi

  deploy:
    name: Deploy
    needs: check-passphrase
    runs-on: ubuntu-latest

    steps:
      - name: Check out staging
        uses: actions/checkout@v5
        with:
          ref: staging

      - name: Show deployed commit
        run: |
          echo "Deploying commit:"
          git log -1 --oneline

          echo
          echo "Full SHA:"
          git rev-parse HEAD

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm run type-check

      - name: Build application
        run: pnpm run build

      - name: Verify Dustpan content in build
        run: |
          echo "Checking built files for Dustpan content..."

          if ! grep -Rqi "dustpan" dist/; then
            echo "Dustpan content was not found in dist/."
            exit 1
          fi

          echo "Dustpan content found in build."

      - name: Get build metadata
        id: build
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "SHA=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Show build metadata
        run: |
          echo "Version: ${{ steps.build.outputs.VERSION }}"
          echo "SHA: ${{ steps.build.outputs.SHA }}"
          echo "Archive: broomstick-${{ steps.build.outputs.VERSION }}-${{ steps.build.outputs.SHA }}-staging.tgz"

      - name: Package build
        run: |
          tar czf \
            "broomstick-${{ steps.build.outputs.VERSION }}-${{ steps.build.outputs.SHA }}-staging.tgz" \
            -C dist .

      - name: Set up Toolforge SSH
        env:
          TF_SSH_KEY: ${{ secrets.TF_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$TF_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan login.toolforge.org >> ~/.ssh/known_hosts

      - name: Upload package to Toolforge
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            "broomstick-${{ steps.build.outputs.VERSION }}-${{ steps.build.outputs.SHA }}-staging.tgz" \
            noncesura@login.toolforge.org:~/broomstick-release/

      - name: Deploy to staging
        run: |
          ssh \
            -tt \
            -i ~/.ssh/id_ed25519 \
            noncesura@login.toolforge.org \
            "become broomstick-staging bash -s" <<'EOF'
          set -e

          ARCHIVE="/home/noncesura/broomstick-release/broomstick-${{ steps.build.outputs.VERSION }}-${{ steps.build.outputs.SHA }}-staging.tgz"

          echo "Deploying archive: $ARCHIVE"

          if [ ! -f "$ARCHIVE" ]; then
            echo "Archive not found: $ARCHIVE"
            exit 1
          fi

          echo "Clearing existing staging files..."
          rm -rf "$HOME/public_html"/*

          echo "Extracting new build..."
          tar xzf "$ARCHIVE" -C "$HOME/public_html/"

          echo "Checking deployed files for Dustpan content..."

          if ! grep -Rqi "dustpan" "$HOME/public_html/"; then
            echo "Dustpan content was not found in deployed files."
            exit 1
          fi

          echo "Deployment complete."
          EOF

      - name: Deployment summary
        run: |
          echo "Deployment completed successfully."
          echo
          echo "Version: ${{ steps.build.outputs.VERSION }}"
          echo "SHA: ${{ steps.build.outputs.SHA }}"
          echo "Archive: broomstick-${{ steps.build.outputs.VERSION }}-${{ steps.build.outputs.SHA }}-staging.tgz"
          echo
          echo "Commit:"
          git log -1 --oneline
