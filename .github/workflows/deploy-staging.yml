name: Deploy to Toolforge (Staging)
on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: 'Enter deploy passphrase to confirm'
        required: true
jobs:
  check-passphrase:
    runs-on: ubuntu-latest
    steps:
      - name: Verify passphrase
        run: |
          if [ "${{ github.event.inputs.passphrase }}" != "${{ secrets.DEPLOY_PASSPHRASE_STAGING }}" ]; then
            echo "Wrong passphrase. Aborting."
            exit 1
          fi
      - name: Verify branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/staging" ]; then
            echo "This workflow must be run from the staging branch."
            exit 1
          fi
  deploy:
    needs: check-passphrase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Package dist
        run: tar czf broomstick-${{ steps.version.outputs.VERSION }}-staging.tgz -C dist .
      - name: Upload to Toolforge
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TF_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan login.toolforge.org >> ~/.ssh/known_hosts
          scp -i ~/.ssh/id_ed25519 broomstick-${{ steps.version.outputs.VERSION }}-staging.tgz noncesura@login.toolforge.org:~/broomstick-release/
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: login.toolforge.org
          username: noncesura
          key: ${{ secrets.TF_SSH_KEY }}
          port: 22
          request_pty: true
          script_stop: true
          script: |
            become broomstick-staging bash -c 'rm -rf ~/public_html/* && tar xzf ~noncesura/broomstick-release/broomstick-${{ steps.version.outputs.VERSION }}-staging.tgz -C ~/public_html/'
